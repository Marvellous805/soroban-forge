[package]
name = "soroban-forge-<CONTRACT_NAME>"
version = "0.2.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
description = "Soroban Forge contract: <CONTRACT_NAME>"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "=27.0.6"

[dev-dependencies]
soroban-sdk = "=27.0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
